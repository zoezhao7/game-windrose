# 新闻自动更新 — 每日通过 GitHub Actions 定时执行
#
# 功能：
#   1. 从 Steam News API 抓取 Windrose 最新公告
#   2. 合并到 data/news.json
#   3. 重新生成 /news/ 列表页和详情页
#   4. 更新首页「最新动态」区块
#   5. 更新 sitemap.xml
#   6. 自动 commit + push（仅在有变更时）
#
# 触发条件：
#   - 每日 UTC 00:00 自动执行
#   - 也可手动触发（workflow_dispatch）

name: Daily News Update

on:
  schedule:
    # NOTE: 每天 UTC 0:00 执行（北京时间 8:00）
    - cron: '0 0 * * *'
  # NOTE: 允许从 GitHub Actions 页面手动触发
  workflow_dispatch:

# NOTE: 授予写入仓库的权限，用于自动 commit
permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # NOTE: 本脚本只使用 Python 标准库，无需 pip install
      - name: Run news update script
        run: python scripts/update_news.py

      - name: Check for changes
        id: check
        run: |
          git diff --quiet && git diff --cached --quiet && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: auto-update news $(date -u +%Y-%m-%d)"
          git push
